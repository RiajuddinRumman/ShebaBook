services:
  postgres:
    image: postgres:16-alpine
    container_name: shebabook-db
    environment:
      POSTGRES_USER: shebabook
      POSTGRES_PASSWORD: shebabook
      POSTGRES_DB: shebabook
    ports:
      - '5432:5432'
    volumes:
      - shebabook-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shebabook -d shebabook']
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  shebabook-pgdata:
